# https://github.com/emilk/eframe_template/blob/main/.github/workflows/rust.yml
name: Rust

on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          TARGET: aarch64-apple-darwin

        - os: ubuntu-latest
          TARGET: x86_64-unknown-linux-gnu

        # For Windows 7 +
        - os: windows-latest
          TARGET: x86_64-win7-windows-msvc
          EXTENSION: .exe

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    - uses: actions/checkout@master

    # Check rust...
    # Windows only
    - name: Switch to nightly (Windows)
      if: contains(matrix.TARGET, 'windows')
      run: |
        rustup default nightly
  
    # Windows only
    - name: Add rust-src component (Windows)
      if: contains(matrix.TARGET, 'windows')
      run: |
        rustup component add rust-src --toolchain nightly-x86_64-pc-windows-msvc

    # macOS, Linux only
    - name: Update Rust (macOS, Linux)
      if: ${{ !contains(matrix.TARGET, 'windows') }}
      run: |
        rustup update

    # Linux only
    - name: Install necessary dependencies for linux
      if: contains(matrix.TARGET, 'linux')
      run: sudo apt-get install libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config libgtk-3-dev

    # Start building...
    # Windows only
    - name: Build (Windows)
      if: contains(matrix.TARGET, 'windows')
      run: |
        cargo build --verbose --release -Z build-std=panic_abort,std --target=${{ matrix.TARGET }}

    # macOS, Linux only
    - name: Build (macOS, Linux)
      if: ${{ !contains(matrix.TARGET, 'windows') }}
      run: |
        cargo build --verbose --release --target=${{ matrix.TARGET }}

    - name: Rename
      run: cp target/${{ matrix.TARGET }}/release/gstool${{ matrix.EXTENSION }} gstool-${{ matrix.TARGET }}${{ matrix.EXTENSION }}

    - uses: actions/upload-artifact@master
      with:
        name: gstool-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        path: gstool-${{ matrix.TARGET }}${{ matrix.EXTENSION }}