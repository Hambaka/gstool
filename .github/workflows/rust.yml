# https://github.com/emilk/eframe_template/blob/main/.github/workflows/rust.yml
name: Rust

on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          TARGET: aarch64-apple-darwin

        - os: ubuntu-latest
          TARGET: x86_64-unknown-linux-gnu

        - os: windows-latest
          TARGET: x86_64-pc-windows-gnu
          EXTENSION: .exe

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    - uses: actions/checkout@master

    - name: Update Rust (mac OS, Linux)
      if: ${{ !contains(matrix.TARGET, 'windows') }}
      run: |
        rustup update
    
    - name: Switch to MinGW (Windows)
      if: contains(matrix.TARGET, 'windows')
      run: |
        rustup default stable-x86_64-pc-windows-gnu
        rustup target add x86_64-pc-windows-gnu
        rustup update


    # For linux
    - name: Install necessary dependencies for linux
      if: contains(matrix.TARGET, 'linux')
      run: sudo apt-get install libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config libgtk-3-dev

    - name: Build
      run: |
        cargo build --verbose --release --target=${{ matrix.TARGET }}

    - name: Rename
      run: cp target/${{ matrix.TARGET }}/release/gstool${{ matrix.EXTENSION }} gstool-${{ matrix.TARGET }}${{ matrix.EXTENSION }}

    - uses: actions/upload-artifact@master
      with:
        name: gstool-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        path: gstool-${{ matrix.TARGET }}${{ matrix.EXTENSION }}