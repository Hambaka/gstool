[package]
name = "gstool"
version = "0.2.0"
authors = ["Hambaka"]
edition = "2024"
# Unnecessary
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = [
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features)
    "system_fonts",
    "links",
    "clipboard",
] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
egui-notify = { git = "https://github.com/Hambaka/egui-notify.git", rev = "c4ebf32935a0d5f0bcb7c97680aa3a78528c996a" }
phf = { version = "0.14", features = ["macros"] }
rfd = "0.17"
# zstd = "0.14"
ruzstd = "0.9"
crc32fast = "1.5"
chardetng = "1.0"
encoding_rs = "0.8"
arboard = { version = "3.7", default-features = false }

[build-dependencies]
serde_json = "1.0"
structured-zstd = "0.2"
# zstd = "0.14"

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
