[package]
name = "gstool"
version = "0.1.0"
edition = "2021"
# Unnecessary
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.1.14", features = ["cargo"] }
# For wasm support -> klask = { git = "https://github.com/Easyoakland/klask.git" }
klask = { git = "https://github.com/xosxos/klask.git", rev = "991c70af" }
phf = { version = "0.11", features = ["macros"] }

[build-dependencies]
serde_json = "1.0"

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true
opt-level = 2
lto = true
codegen-units = 1
